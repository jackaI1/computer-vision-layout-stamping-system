name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test suite
        run: python -m pytest -q
      - name: Traceability matrix is complete and current
        run: python quality/trace_matrix.py --check
      - name: IQ/OQ record matches the validated files
        run: python quality/oq_report.py --check
