name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test suite
        run: python -m pytest -q
      - name: Traceability matrix is complete and current
        run: python quality/trace_matrix.py --check
      - name: FMEA scores, evidence and report are valid
        run: python quality/fmea_report.py --check
      - name: IQ/OQ record matches the validated files
        run: python quality/oq_report.py --check
      - name: Generate and stamp a real CAD sheet set
        run: |
          python examples/make_sample_cad.py --output-dir output/cad-input
          python -m stamper.cad stamp output/cad-input/floor_plan.dxf --seal output/cad-input/demo_seal.dxf --layout A101 --layout A102 --center 350 180 --diameter 40 --date 2026-11-04 --caption "DEMONSTRATION ONLY" -o output/cad/plan_stamped.dxf --pdf output/cad/plan_stamped.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: cad-drawing-and-plots
          path: output/cad/
          retention-days: 7

  dwg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_ODA: "1"
      QT_QPA_PLATFORM: xcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python and ODA runtime dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Download official free ODA converter and verify release checksum
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error --max-time 120 'https://www.opendesign.com/guestfiles/get?filename=ODAFileConverter_QT6_lnxX64_11dll.AppImage' -o oda.AppImage
          echo 'a73eea1dfc873cd46b94bfa07760dcff0082c4300dd33c5401e8a526cfab787b  oda.AppImage' | sha256sum --check
          chmod +x oda.AppImage
          ./oda.AppImage --appimage-extract > /dev/null
          echo "ODA_FILE_CONVERTER=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Real DXF to DWG to stamped DWG roundtrip
        run: python -m pytest tests/test_cad_cli.py::test_real_oda_dwg_roundtrip_and_stamp -q
